<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="../Theme/theme.css">
    <style>
        body.review-modal-open {
            overflow: hidden;
        }

        .review-button {
            border: none;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .review-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.72);
        }

        .review-modal.open {
            display: flex;
        }

        .review-modal-card {
            position: relative;
            width: min(760px, 100%);
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            padding: 30px;
            border-radius: 18px;
            background: white;
            color: #0f172a;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.3);
        }

        .review-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #eef2f7;
            color: #0f172a;
            cursor: pointer;
            font-size: 26px;
            line-height: 1;
        }

        .review-modal-close:hover {
            background: #dce5f1;
        }

        .review-modal-card > h2 {
            margin: 0 48px 6px 0;
            font-size: 28px;
        }

        .review-modal-intro {
            margin: 0 0 24px;
            color: #64748b;
        }

        .review-modal-layout {
            display: grid;
            grid-template-columns: 210px minmax(0, 1fr);
            gap: 28px;
            align-items: start;
        }

        .review-product-preview {
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            text-align: center;
        }

        .review-product-preview img {
            display: block;
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
        }

        .review-product-preview h3 {
            margin: 14px 0 2px;
            color: #0f172a;
        }

        .product-review-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .popup-star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 7px;
            margin-bottom: 8px;
        }

        .popup-star-rating input {
            position: absolute;
            opacity: 0;
        }

        .popup-star-rating label {
            margin: 0;
            color: #d5dce7;
            cursor: pointer;
            font-size: 38px;
            line-height: 1;
        }

        .popup-star-rating label:hover,
        .popup-star-rating label:hover ~ label,
        .popup-star-rating input:checked ~ label {
            color: #f59e0b;
        }

        .popup-star-rating input:focus-visible + label {
            outline: 2px solid #1454c4;
            outline-offset: 3px;
        }

        .popup-rating-message {
            min-height: 20px;
            margin: 0 0 18px;
            color: #64748b;
            font-size: 14px;
        }

        .product-review-form textarea {
            width: 100%;
            min-height: 125px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
        }

        .product-review-form textarea:focus {
            outline: none;
            border-color: #1454c4;
            box-shadow: 0 0 0 3px rgba(20, 84, 196, 0.14);
        }

        .submit-product-review {
            width: 100%;
            margin-top: 14px;
            padding: 13px 18px;
            border: none;
            border-radius: 9px;
            background: #1454c4;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .submit-product-review:hover {
            background: #0d3d94;
        }

        .review-success-message {
            min-height: 22px;
            margin: 12px 0 0;
            color: #15803d;
            font-weight: bold;
        }

        body.dark-theme .review-modal-card,
        body.dark-theme .review-product-preview {
            border-color: #374151 !important;
            background: #1f2937 !important;
            color: white !important;
        }

        body.dark-theme .review-modal-close {
            background: #374151;
            color: white;
        }

        body.dark-theme .review-modal-intro,
        body.dark-theme .popup-rating-message {
            color: #cbd5e1 !important;
        }

        body.dark-theme .review-success-message {
            color: #86efac !important;
        }

        @media (max-width: 650px) {
            .review-modal {
                padding: 12px;
            }

            .review-modal-card {
                max-height: calc(100vh - 24px);
                padding: 24px 20px;
            }

            .review-modal-layout {
                grid-template-columns: 1fr;
            }

            .review-product-preview {
                display: grid;
                grid-template-columns: 100px 1fr;
                align-items: center;
                gap: 14px;
                text-align: left;
            }

            .review-product-preview img {
                height: 90px;
            }

            .review-product-preview h3 {
                margin: 0;
            }
        }
    </style>
</head>

<body>

   <header class="navbar">

    <div class="logo">
        <span>Elite<span class="blue">Sports</span></span>
    </div>

    <nav class="navLinks">
        <a href="../Home Page/Home.html">Home</a>
        <a href="../About Page/About.html">About</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="../review system/reviewsystem 1.html">Reviews</a>
        <a href="../team view/team.html">Team</a>
    </nav>
    <button id="themeToggleBtn" class="theme-toggle-btn">
    🌙 Dark
</button>

    <div class="nav-actions">

    <a href="cart.html" class="cart-link">
        🛒 Cart (<span id="cartCount">0</span>)
    </a>

    <a href="saved.html" class="saved-link">
        🔖 Saved (<span id="savedCount">0</span>)
    </a>

</div>

</header>


    <main class="product-page">

        <div class="product-image-area">
            <img id="productImage" src="" alt="">
        </div>


        <div class="product-details">

            <p id="productCategory" class="category"></p>

            <h1 id="productName"></h1>

            <h2 id="productPrice"></h2>

            <p id="productDescription"></p>

            <div class="purchase-options">

    <label for="quantity">Quantity</label>

    <select id="quantity">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

</div>


<div class="product-actions">

    <button id="addToCart" class="cart-button">
        Add to Cart
    </button>

    <button id="buyNow" class="buy-button">
        Buy Now
    </button>

    <button id="saveLater" class="save-button">
        Save for Later
    </button>

</div>


<p id="actionMessage" class="action-message"></p>


<button type="button" id="openReviewModal" class="review-button">
    Write a Review
</button>

<a href="catalogue.html" class="back-button">
    ← Back to Catalogue
</a>
        </div>

    </main>


    <div class="review-modal" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
        <div class="review-modal-card">
            <button type="button" class="review-modal-close" id="closeReviewModal" aria-label="Close review popup">&times;</button>

            <h2 id="reviewModalTitle">Leave a Product Review</h2>
            <p class="review-modal-intro">Share your experience with other customers.</p>

            <div class="review-modal-layout">
                <div class="review-product-preview">
                    <img id="reviewProductImage" src="" alt="">
                    <h3 id="reviewProductName"></h3>
                </div>

                <form id="productReviewForm" class="product-review-form">
                    <span id="popupRatingLabel"><strong>Your rating</strong></span>
                    <div class="popup-star-rating" role="radiogroup" aria-labelledby="popupRatingLabel">
                        <input type="radio" id="popupStar5" name="productRating" value="5" required><label for="popupStar5" title="Excellent">&#9733;</label>
                        <input type="radio" id="popupStar4" name="productRating" value="4"><label for="popupStar4" title="Very good">&#9733;</label>
                        <input type="radio" id="popupStar3" name="productRating" value="3"><label for="popupStar3" title="Good">&#9733;</label>
                        <input type="radio" id="popupStar2" name="productRating" value="2"><label for="popupStar2" title="Fair">&#9733;</label>
                        <input type="radio" id="popupStar1" name="productRating" value="1"><label for="popupStar1" title="Poor">&#9733;</label>
                    </div>
                    <p class="popup-rating-message" id="popupRatingMessage">Select a star rating</p>

                    <label for="productReviewText">Your review</label>
                    <textarea id="productReviewText" placeholder="Tell other customers what you liked or disliked..." required></textarea>

                    <button type="submit" class="submit-product-review">Submit Review</button>
                    <p class="review-success-message" id="reviewSuccessMessage" role="status"></p>
                </form>
            </div>
        </div>
    </div>


    <script src="product.js"></script>
    <script>
        const reviewStorageKey = "eliteSportsReviews";
        const openReviewModalButton = document.getElementById("openReviewModal");
        const closeReviewModalButton = document.getElementById("closeReviewModal");
        const reviewModal = document.getElementById("reviewModal");
        const productReviewForm = document.getElementById("productReviewForm");
        const popupRatingInputs = document.querySelectorAll('input[name="productRating"]');
        const popupRatingMessage = document.getElementById("popupRatingMessage");
        const reviewSuccessMessage = document.getElementById("reviewSuccessMessage");
        const productReviewText = document.getElementById("productReviewText");

        function getStoredReviews() {
            try {
                const reviews = JSON.parse(localStorage.getItem(reviewStorageKey));
                return Array.isArray(reviews) ? reviews : [];
            } catch (error) {
                return [];
            }
        }

        function openReviewPopup() {
            if (!product) {
                return;
            }

            document.getElementById("reviewProductImage").src = product.image;
            document.getElementById("reviewProductImage").alt = product.name;
            document.getElementById("reviewProductName").textContent = product.name;
            productReviewForm.reset();
            popupRatingMessage.textContent = "Select a star rating";
            reviewSuccessMessage.textContent = "";
            reviewModal.classList.add("open");
            document.body.classList.add("review-modal-open");
            closeReviewModalButton.focus();
        }

        function closeReviewPopup() {
            reviewModal.classList.remove("open");
            document.body.classList.remove("review-modal-open");
            openReviewModalButton.focus();
        }

        popupRatingInputs.forEach(input => input.addEventListener("change", function () {
            popupRatingMessage.textContent = `${input.value} out of 5 stars selected`;
            reviewSuccessMessage.textContent = "";
        }));

        openReviewModalButton.addEventListener("click", openReviewPopup);
        closeReviewModalButton.addEventListener("click", closeReviewPopup);

        reviewModal.addEventListener("click", function (event) {
            if (event.target === reviewModal) {
                closeReviewPopup();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && reviewModal.classList.contains("open")) {
                closeReviewPopup();
            }
        });

        productReviewForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!product) {
                return;
            }

            const selectedRating = document.querySelector('input[name="productRating"]:checked');
            const reviewText = productReviewText.value.trim();

            if (!selectedRating || !reviewText) {
                return;
            }

            const reviews = getStoredReviews();
            reviews.unshift({
                id: Date.now(),
                product: product.name,
                image: `../catalogue/${product.image}`,
                rating: Number(selectedRating.value),
                text: reviewText,
                createdAt: new Date().toISOString()
            });

            localStorage.setItem(reviewStorageKey, JSON.stringify(reviews));
            productReviewForm.reset();
            popupRatingMessage.textContent = "Select a star rating";
            reviewSuccessMessage.textContent = "Thank you! Your review has been saved.";
        });
    </script>
<script src="../Theme/theme.js"></script>
</body>
</html>
