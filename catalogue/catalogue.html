<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <link rel="stylesheet" href="catalogue.css">
</head>
<body>
<header>
<div><strong>EliteSports</strong></div>
<nav>
<a href="../Home.html">Home</a>
<a href="../About.html">About</a>
<a href="./catalogue.html">Catalogue</a>
<a href="../review system/reviewsystem 1.html">Reviews</a>
</nav>
</header>

<div class="container">
<h1>Sports Catalogue</h1>
<input class="search" id="search" placeholder="Search products...">

<div class="grid" id="products">
</div>
</div>

<footer>© 2026 Elite Sports Hub</footer>

<script>
const data = [
["Football","Ball","RM89","images/football.jpg"],
["Basketball","Ball","RM99","images/basketball.jpg"],
["Running Shoes","Footwear","RM299","images/running-shoes.jpg"],
["Football Boots","Footwear","RM359","images/football-boots.jpg"],
["Training Gloves","Accessories","RM49","images/training-gloves.jpg"],
["Gym Bag","Gear","RM129","images/gym-bag.jpg"],
["Yoga Mat","Fitness","RM79","images/yoga-mat.jpg"],
["Skipping Rope","Fitness","RM35","images/skipping-rope.jpg"],
["Tennis Racket","Tennis","RM459","images/tennis-racket.jpg"],
["Volleyball","Ball","RM69","images/volleyball.jpg"],
["Water Bottle","Accessories","RM39","images/water-bottle.jpg"],
["Sports Cap","Accessories","RM45","images/sports-cap.jpg"]
];

const wrap=document.getElementById("products");

function render(list){
 wrap.innerHTML="";
 list.forEach(p=>{
  wrap.innerHTML+=`
  <div class="card">
    <img src="${p[3]}" alt="${p[0]}">
    <div class="info">
      <div class="category">${p[1]}</div>
      <h3>${p[0]}</h3>
      <div class="price">${p[2]}</div>
      <a class="btn" href="../review system/reviewsystem 1.html">View</a>
    </div>
  </div>`;
 });
}
render(data);

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 render(data.filter(p=>p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q)));
});
</script>
</body>
</html>
