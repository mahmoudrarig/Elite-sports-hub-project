<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Customer Review History | Elite Sports Hub
    </title>

    <link
        rel="stylesheet"
        href="reviewsystem.css"
    >

    <link
        rel="stylesheet"
        href="../Theme/theme.css"
    >
</head>


<body>

    <!-- TOP NAVIGATION -->

    <nav
        class="top-navigation"
        aria-label="Page navigation"
    >

        <div class="top-navigation-inner">

            <a
                class="back-home"
                href="../Home Page/Home.html"
            >
                <span aria-hidden="true">&larr;</span>
                Back to Home
            </a>


            <div class="nav-brand">
                Elite<span>Sports</span>
            </div>

        </div>

    </nav>


    <!-- HEADER -->

    <header class="review-header">

        <div class="review-header-inner">

            <h1>
                Customer Review History
            </h1>

            <p>
                Products reviewed by our customers.
            </p>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="container">

        <section
            class="reviews"
            aria-labelledby="reviewHistoryTitle"
        >

            <h2 id="reviewHistoryTitle">
                Reviewed Products
            </h2>


            <!-- REVIEWS APPEAR HERE -->

            <div id="reviewList">

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="reviewsystem.js"></script>

    <script src="../Theme/theme.js"></script>

</body>

</html>
