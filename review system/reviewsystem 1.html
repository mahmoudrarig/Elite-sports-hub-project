<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Review History | Elite Sports Hub</title>
  <link rel="stylesheet" href="reviewsystem.css">
  <style>
    .top-navigation {
      position: sticky;
      z-index: 20;
      top: 0;
      border-bottom: 1px solid #dbe3ee;
      background: white;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    .top-navigation-inner {
      display: flex;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 13px 24px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-brand {
      color: #0f172a;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .nav-brand span {
      color: #1a73e8;
    }

    .back-home {
      display: inline-flex;
      padding: 10px 16px;
      border: 1px solid #1454c4;
      border-radius: 8px;
      background: #1454c4;
      color: white;
      font-weight: 700;
      text-decoration: none;
      align-items: center;
      gap: 7px;
      box-shadow: 0 3px 9px rgba(20, 84, 196, 0.2);
    }

    .back-home:hover,
    .back-home:focus-visible {
      background: #0d3d94;
      color: white;
    }

    .back-home:focus-visible {
      outline: 3px solid rgba(26, 115, 232, 0.28);
      outline-offset: 3px;
    }

    .review-header {
      padding: 38px 24px 42px;
      text-align: left;
    }

    .review-header-inner {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .review-header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 2.7rem);
    }

    .review-header p {
      margin: 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 1.05rem;
    }

    .container {
      max-width: 960px;
      margin-top: 30px;
    }

    .reviews {
      padding: 32px;
    }

    .reviews > h2 {
      margin-bottom: 22px;
      font-size: 1.55rem;
    }

    .review-history-card {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      padding: 22px 0;
    }

    .review-thumbnail {
      width: 120px;
      height: 100px;
      border-radius: 12px;
      object-fit: cover;
      background: #e8eef7;
    }

    .review-copy h3 {
      margin: 8px 0 4px;
      color: #0f172a;
      font-size: 1.15rem;
    }

    .review-copy p {
      margin: 8px 0 0;
      color: #334155;
      line-height: 1.6;
    }

    .review-date {
      color: #64748b;
      font-size: 0.85rem;
    }

    .empty-state {
      padding: 42px 20px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      text-align: center;
    }

    .empty-state p {
      margin: 0 0 16px;
      color: #475569;
      font-style: normal;
    }

    .leave-review-link {
      display: inline-block;
      padding: 10px 17px;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-style: normal;
      font-weight: 700;
      text-decoration: none;
    }

    .leave-review-link:hover,
    .leave-review-link:focus-visible {
      background: #1558b0;
    }

    @media (max-width: 600px) {
      .top-navigation-inner {
        padding: 11px 16px;
      }

      .nav-brand {
        font-size: 1rem;
      }

      .back-home {
        padding: 9px 13px;
      }

      .review-header {
        padding: 30px 18px 34px;
      }

      .reviews {
        padding: 22px;
      }

      .review-history-card {
        grid-template-columns: 1fr;
      }

      .review-thumbnail {
        width: 100%;
        height: 190px;
      }
    }
  </style>
</head>
<body>
  <nav class="top-navigation" aria-label="Page navigation">
    <div class="top-navigation-inner">
      <a class="back-home" href="../Home Page/Home.html"><span aria-hidden="true">&larr;</span> Back to Home</a>
      <div class="nav-brand">Elite<span>Sports</span></div>
    </div>
  </nav>

  <header class="review-header">
    <div class="review-header-inner">
      <h1>Customer Review History</h1>
      <p>Products reviewed by our customers.</p>
    </div>
  </header>

  <main class="container">
    <section class="reviews" aria-labelledby="reviewHistoryTitle">
      <h2 id="reviewHistoryTitle">Reviewed Products</h2>
      <div id="reviewList"></div>
    </section>
  </main>

  <script>
    const catalogueImages = {
      'Football': '../catalogue/images/football.jpg',
      'Basketball': '../catalogue/images/basketball.jpg',
      'Running Shoes': '../catalogue/images/running-shoes.jpg',
      'Football Boots': '../catalogue/images/football-boots.jpg',
      'Training Gloves': '../catalogue/images/training-gloves.jpg',
      'Gym Bag': '../catalogue/images/gym-bag.jpg',
      'Yoga Mat': '../catalogue/images/yoga-mat.jpg',
      'Skipping Rope': '../catalogue/images/skipping-rope.jpg',
      'Tennis Racket': '../catalogue/images/tennis-racket.jpg',
      'Volleyball': '../catalogue/images/volleyball.jpg',
      'Water Bottle': '../catalogue/images/water-bottle.jpg',
      'Sports Cap': '../catalogue/images/sports-cap.jpg'
    };

    const storageKey = 'eliteSportsReviews';
    const reviewList = document.getElementById('reviewList');

    function loadReviews() {
      try {
        const savedReviews = JSON.parse(localStorage.getItem(storageKey));
        return Array.isArray(savedReviews) ? savedReviews : [];
      } catch (error) {
        return [];
      }
    }

    function formatDate(dateValue) {
      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return '';
      }

      return new Intl.DateTimeFormat('en-MY', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      }).format(date);
    }

    function createReviewItem(review) {
      const reviewItem = document.createElement('article');
      reviewItem.className = 'review-item review-history-card';

      const image = document.createElement('img');
      image.className = 'review-thumbnail';
      image.src = catalogueImages[review.product];
      image.alt = review.product + ' product image';

      const copy = document.createElement('div');
      copy.className = 'review-copy';

      const meta = document.createElement('div');
      meta.className = 'review-meta';

      const author = document.createElement('strong');
      author.textContent = 'Customer';

      const ratingDisplay = document.createElement('span');
      ratingDisplay.className = 'rating';
      const rating = Math.min(5, Math.max(1, Number(review.rating) || 1));
      ratingDisplay.textContent = `${'\u2605'.repeat(rating)}${'\u2606'.repeat(5 - rating)} ${rating}/5`;

      const productHeading = document.createElement('h3');
      productHeading.textContent = review.product;

      const date = document.createElement('div');
      date.className = 'review-date';
      date.textContent = formatDate(review.createdAt);

      const reviewBody = document.createElement('p');
      reviewBody.textContent = review.text;
      reviewBody.style.whiteSpace = 'pre-wrap';

      meta.append(author, ratingDisplay);
      copy.append(meta, productHeading, date, reviewBody);
      reviewItem.append(image, copy);
      return reviewItem;
    }

    function showEmptyState() {
      reviewList.className = 'empty-state';
      reviewList.innerHTML = '';

      const message = document.createElement('p');
      message.textContent = 'No products reviewed yet';

      const leaveReviewLink = document.createElement('a');
      leaveReviewLink.className = 'leave-review-link';
      leaveReviewLink.href = '../catalogue/catalogue.html';
      leaveReviewLink.textContent = 'Leave a review';

      reviewList.append(message, leaveReviewLink);
    }

    function renderReviews() {
      const reviews = loadReviews().filter(review => catalogueImages[review.product]);
      reviewList.innerHTML = '';
      reviewList.className = '';

      if (reviews.length === 0) {
        showEmptyState();
        return;
      }

      reviews.forEach(review => reviewList.append(createReviewItem(review)));
    }

    window.addEventListener('storage', renderReviews);
    renderReviews();
  </script>
</body>
</html>
